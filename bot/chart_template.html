<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trades du backtest</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --border: #e2e1dc; --grid: #ecebe7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --price: #8d8c86; --buy: #2a78d6; --sell: #eb6834; --equity: #2a78d6;
  --good: #0ca30c; --good-text: #006300; --critical: #d03b3b; --critical-text: #b42f2f;
  --refused: #7a7974; --hover: rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #2f2f2c; --grid: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --price: #77766f; --buy: #3987e5; --sell: #d95926; --equity: #3987e5;
    --good: #0ca30c; --good-text: #4cc94c; --critical: #d03b3b; --critical-text: #ef7373;
    --refused: #8f8e86; --hover: rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --border: #2f2f2c; --grid: #262624;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --price: #77766f; --buy: #3987e5; --sell: #d95926; --equity: #3987e5;
  --good: #0ca30c; --good-text: #4cc94c; --critical: #d03b3b; --critical-text: #ef7373;
  --refused: #8f8e86; --hover: rgba(255,255,255,.05);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 2px; font-weight: 650; }
h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
.sub { color: var(--text-secondary); margin: 0 0 18px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .k { color: var(--text-secondary); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .d { color: var(--text-muted); font-size: 12px; }
.pos { color: var(--good-text); } .neg { color: var(--critical-text); }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 10px; margin-bottom: 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--text-secondary); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
#price, #equity { display: block; width: 100%; overflow: visible; }
.legend svg { flex: none; }
svg text { font-size: 11px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
.tip { position: fixed; pointer-events: none; z-index: 10; max-width: 340px; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 12.5px;
  box-shadow: 0 6px 24px rgba(0,0,0,.18); display: none; }
.tip b { font-weight: 650; } .tip .m { color: var(--text-muted); margin-top: 6px; font-style: italic; white-space: pre-line; }
.tip table { border-collapse: collapse; margin-top: 4px; } .tip td { padding: 1px 8px 1px 0; vertical-align: top; }
.tip td:first-child { color: var(--text-secondary); }
.tablewrap { overflow-x: auto; }
table.trades { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
table.trades th { text-align: left; color: var(--text-secondary); font-weight: 550; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.trades td { padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.trades tbody tr { cursor: pointer; } table.trades tbody tr:hover { background: var(--hover); }
td.num, th.num { text-align: right; }
.side { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.pbar { display: inline-block; height: 8px; border-radius: 2px; vertical-align: middle; margin-left: 6px; }
.note { color: var(--text-muted); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="tiles" id="tiles"></div>

  <div class="card">
    <div class="bar">
      <div class="seg" id="days" role="group" aria-label="Période affichée"></div>
      <div class="legend">
        <span><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1 L11 11 L1 11Z" fill="var(--buy)"/></svg>BUY</span>
        <span><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 11 L11 1 L1 1Z" fill="var(--sell)"/></svg>SELL</span>
        <span><svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke="var(--critical)" stroke-width="2" stroke-dasharray="4 3"/></svg>SL</span>
        <span><svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke="var(--good)" stroke-width="2" stroke-dasharray="1.5 2.5"/></svg>TP</span>
        <span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="var(--good)" stroke="var(--surface-1)" stroke-width="1.5"/></svg>sortie gagnante</span>
        <span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="var(--critical)" stroke="var(--surface-1)" stroke-width="1.5"/></svg>sortie perdante</span>
        <span><svg width="10" height="10"><path d="M1 1L9 9M9 1L1 9" stroke="var(--refused)" stroke-width="2"/></svg>signal non pris</span>
      </div>
    </div>
    <svg id="price" aria-label="Prix de l'or et trades"></svg>
    <p class="note">Survole un triangle pour le détail du trade. Clique une ligne du tableau pour zoomer dessus. La taille du triangle suit le lot.</p>
  </div>

  <div class="card">
    <h2>Solde du compte simulé</h2>
    <svg id="equity" aria-label="Évolution du solde"></svg>
  </div>

  <div class="card">
    <h2>Trades : sens, lot, résultat</h2>
    <div class="tablewrap"><table class="trades" id="tbl"></table></div>
  </div>

  <div class="card" id="refcard">
    <h2>Signaux non pris</h2>
    <div class="tablewrap"><table class="trades" id="reftbl"></table></div>
  </div>
</main>
<div class="tip" id="tip"></div>

<script>
const D = /*__DATA__*/null;
const NS = "http://www.w3.org/2000/svg";
const nf = (v, d = 2) => v.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const money = v => (v > 0 ? "+" : v < 0 ? "−" : "") + nf(Math.abs(v)) + " $";
const ms = s => Date.parse(s + "Z");
const fmtT = t => { const d = new Date(t); return d.toLocaleString("fr-FR", { timeZone: "UTC", weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
const fmtH = t => new Date(t).toLocaleTimeString("fr-FR", { timeZone: "UTC", hour: "2-digit", minute: "2-digit" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

const T0 = ms(D.t0);
const PRICE = D.price.map(([m, c]) => [T0 + m * 60000, c]);
const START = ms(D.start), END = Math.min(ms(D.end), PRICE[PRICE.length - 1][0] + 60000);
const TRADES = D.trades.map(t => {
  const open = ms(t.fill_t || t.t);
  const exits = t.exits.map(e => ({ ...e, ms: ms(e.t) }));
  const close = exits.length ? Math.max(...exits.map(e => e.ms)) : END;
  return { ...t, open, close, exits, signalMs: ms(t.t), moves: t.sl_moves.map(m => ({ ms: ms(m.t), sl: m.sl })) };
});
const REFUSED = D.refused.map(r => ({ ...r, ms: ms(r.t) }));
const EQUITY = D.equity.map(([t, v]) => [ms(t), v]);

// ---------- en-tête
const S = D.stats;
document.getElementById("title").textContent = D.title;
document.getElementById("sub").textContent = `${fmtT(START)} → ${fmtT(END)} · heure du serveur MT5 · solde de départ ${nf(S.balance0, 0)} $ · ${S.fixed_lot > 0 ? `lot fixe ${nf(S.fixed_lot)} par signal` : `risque ${nf(S.risk_pct, 1)} % par trade`}`;
const lots = TRADES.map(t => t.lot);
const tiles = [
  ["Résultat", `<span class="${S.pnl >= 0 ? "pos" : "neg"}">${money(S.pnl)}</span>`, `${S.pnl >= 0 ? "+" : "−"}${nf(Math.abs(100 * S.pnl / S.balance0))} % · solde final ${nf(S.final)} $`],
  ["Trades pris", S.n, `${S.signals} signaux détectés · ${S.signals - S.n} non pris`],
  ["Gagnants / perdants", `${S.wins} / ${S.losses}`, S.n ? `${Math.round(100 * S.wins / S.n)} % de réussite` : ""],
  ["Pire baisse", `<span class="neg">−${nf(S.max_dd)} $</span>`, `${nf(100 * S.max_dd / S.balance0)} % du solde`],
  ["Lot par trade", lots.length ? `${nf(Math.min(...lots))} – ${nf(Math.max(...lots))}` : "—", lots.length ? `moyenne ${nf(lots.reduce((a, b) => a + b, 0) / lots.length)} lot` : ""],
];
document.getElementById("tiles").innerHTML = tiles.map(([k, v, d]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`).join("");

// ---------- filtres (jours)
let view = { from: START, to: END, focus: null };
const days = [];
for (let t = Date.UTC(new Date(START).getUTCFullYear(), new Date(START).getUTCMonth(), new Date(START).getUTCDate()); t < END; t += 86400000) {
  const from = Math.max(t, START), to = Math.min(t + 86400000, END);
  if (PRICE.some(([pt]) => pt >= from && pt < to)) days.push({ from, to, label: new Date(t).toLocaleDateString("fr-FR", { timeZone: "UTC", weekday: "short", day: "2-digit", month: "2-digit" }) });
}
const dayBox = document.getElementById("days");
function renderDays() {
  const btns = [{ from: START, to: END, label: "Tout" }, ...days];
  dayBox.innerHTML = "";
  btns.forEach(b => {
    const x = document.createElement("button");
    x.textContent = b.label;
    x.setAttribute("aria-pressed", !view.focus && view.from === b.from && view.to === b.to);
    x.onclick = () => { view = { from: b.from, to: b.to, focus: null }; draw(); };
    dayBox.appendChild(x);
  });
  if (view.focus) {
    const x = document.createElement("button");
    x.textContent = `Trade #${view.focus} ✕`;
    x.setAttribute("aria-pressed", "true");
    x.onclick = () => { view = { from: START, to: END, focus: null }; draw(); };
    dayBox.appendChild(x);
  }
}

// ---------- tooltip
const tip = document.getElementById("tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.style.display = "none"; };

function tradeTip(t) {
  const legs = t.legs.map((l, i) => `${nf(l.vol)} → TP${i + 1} ${nf(l.tp)}`).join("<br>");
  const slPath = [nf(t.sl), ...t.moves.filter(m => m.sl !== t.sl).map(m => `${nf(m.sl)} (${fmtH(m.ms)})`)].join(" → ");
  const exits = t.exits.map(e => `TP${e.leg} part ${nf(e.vol)} : sortie ${nf(e.price)} à ${fmtH(e.ms)}, <span class="${e.pnl >= 0 ? "pos" : "neg"}">${money(e.pnl)}</span>`).join("<br>");
  return `<b>#${t.id} · ${t.side === "BUY" ? "▲ BUY" : "▼ SELL"}</b> · ${fmtT(t.signalMs)}
  <table>
  <tr><td>Lot total</td><td><b>${nf(t.lot)} lot</b> (risque ${nf(t.risk)} $)</td></tr>
  <tr><td>Répartition</td><td>${legs}</td></tr>
  <tr><td>Entrée</td><td>${nf(t.entry)} (${t.type === "market" ? "au marché" : "ordre limite"})</td></tr>
  <tr><td>SL</td><td>${slPath}</td></tr>
  <tr><td>IA</td><td>${esc(t.verdict || "—")}</td></tr>
  <tr><td>Sorties</td><td>${exits || "—"}</td></tr>
  <tr><td>Résultat</td><td><b class="${t.pnl >= 0 ? "pos" : "neg"}">${money(t.pnl)}</b>${t.tps_reached ? ` · TP${t.tps_reached} atteint` : ""}</td></tr>
  </table>${t.msg ? `<div class="m">« ${esc(t.msg)} »</div>` : ""}`;
}

// ---------- échelles
function scales(svg, h, yVals, pad = { l: 8, r: 58, t: 12, b: 24 }) {
  const w = svg.parentElement.clientWidth - 28;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`); svg.setAttribute("height", h); svg.innerHTML = "";
  let lo = Math.min(...yVals), hi = Math.max(...yVals);
  const m = (hi - lo) * 0.06 || 1; lo -= m; hi += m;
  const x = t => pad.l + (t - view.from) / (view.to - view.from) * (w - pad.l - pad.r);
  const y = v => pad.t + (hi - v) / (hi - lo) * (h - pad.t - pad.b);
  const inv = px => view.from + (px - pad.l) / (w - pad.l - pad.r) * (view.to - view.from);
  return { w, h, lo, hi, x, y, inv, pad };
}
function niceStep(range, n) { const raw = range / n, p = 10 ** Math.floor(Math.log10(raw)); return [1, 2, 2.5, 5, 10].map(k => k * p).find(s => s >= raw); }
function axes(svg, s, fmtY) {
  const step = niceStep(s.hi - s.lo, 5);
  for (let v = Math.ceil(s.lo / step) * step; v <= s.hi; v += step) {
    el("line", { x1: s.pad.l, x2: s.w - s.pad.r, y1: s.y(v), y2: s.y(v), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    el("text", { x: s.w - s.pad.r + 6, y: s.y(v) + 4 }, svg).textContent = fmtY(v);
  }
  const span = view.to - view.from, H = 3600000;
  const tstep = [15 * 60000, 30 * 60000, H, 2 * H, 3 * H, 6 * H, 12 * H, 24 * H].find(st => span / st <= Math.max(4, s.w / 110));
  for (let t = Math.ceil(view.from / tstep) * tstep; t <= view.to; t += tstep) {
    const lbl = tstep >= 24 * H || (new Date(t).getUTCHours() === 0 && new Date(t).getUTCMinutes() === 0)
      ? new Date(t).toLocaleDateString("fr-FR", { timeZone: "UTC", weekday: "short", day: "2-digit" }) : fmtH(t);
    el("text", { x: s.x(t), y: s.h - 6, "text-anchor": "middle" }, svg).textContent = lbl;
  }
}
function crosshair(svg, s, valueAt, fmt) {
  const g = el("g", { style: "pointer-events:none", visibility: "hidden" }, svg);
  const vl = el("line", { y1: s.pad.t, y2: s.h - s.pad.b, stroke: "var(--text-muted)", "stroke-width": 1, "stroke-dasharray": "2 3" }, g);
  const dot = el("circle", { r: 4, fill: "var(--text-primary)", stroke: "var(--surface-1)", "stroke-width": 2 }, g);
  const hit = el("rect", { x: s.pad.l, y: 0, width: s.w - s.pad.l - s.pad.r, height: s.h, fill: "transparent" });
  svg.insertBefore(hit, svg.firstChild.nextSibling);
  hit.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * s.w / r.width;
    const t = s.inv(px), v = valueAt(t);
    if (v == null) return hideTip();
    g.setAttribute("visibility", "visible");
    vl.setAttribute("x1", s.x(t)); vl.setAttribute("x2", s.x(t));
    dot.setAttribute("cx", s.x(t)); dot.setAttribute("cy", s.y(v));
    showTip(fmt(t, v), ev);
  });
  hit.addEventListener("mouseleave", () => { g.setAttribute("visibility", "hidden"); hideTip(); });
}
function priceAt(t) {
  let lo = 0, hi = PRICE.length - 1;
  if (t < PRICE[0][0] || t > PRICE[hi][0] + 60000) return null;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (PRICE[mid][0] <= t) lo = mid; else hi = mid - 1; }
  return PRICE[lo][1];
}

// ---------- graphique des prix + trades
function drawPrice() {
  const svg = document.getElementById("price");
  const vis = PRICE.filter(([t]) => t >= view.from && t <= view.to);
  const tr = TRADES.filter(t => t.close >= view.from && t.open <= view.to);
  const yv = vis.map(p => p[1]);
  if (view.focus) tr.forEach(t => { yv.push(t.sl, ...t.legs.map(l => l.tp), t.entry); });
  const s = scales(svg, window.innerWidth < 640 ? 300 : 400, yv.length ? yv : [0, 1]);
  axes(svg, s, v => nf(v, 0));

  // prix : min/max par pixel pour garder les mèches visibles sans dessiner 6000 points
  const cols = new Map();
  vis.forEach(([t, c]) => { const k = Math.round(s.x(t)); const a = cols.get(k); if (!a) cols.set(k, [c, c, c]); else { a[0] = Math.min(a[0], c); a[1] = Math.max(a[1], c); a[2] = c; } });
  let d = "", prevGap = null;
  [...cols.entries()].sort((a, b) => a[0] - b[0]).forEach(([px, [mn, mx, last]], i, arr) => {
    const gap = i > 0 && px - arr[i - 1][0] > 12; // marché fermé : on coupe la ligne
    d += (i === 0 || gap ? "M" : "L") + px + "," + s.y(mn).toFixed(1);
    if (mx !== mn) d += "L" + px + "," + s.y(mx).toFixed(1);
    d += "L" + px + "," + s.y(last).toFixed(1);
  });
  el("path", { d, fill: "none", stroke: "var(--price)", "stroke-width": 1.5, "stroke-linejoin": "round" }, svg);
  crosshair(svg, s, priceAt, (t, v) => `<b>${nf(v)}</b> · ${fmtT(t)}`);

  const zoomed = view.to - view.from <= 36 * 3600000;
  // niveaux SL / TP
  tr.forEach(t => {
    const x0 = s.x(Math.max(t.open, view.from)), x1 = s.x(Math.min(t.close, view.to));
    t.legs.forEach((l, i) => {
      const ex = t.exits.find(e => e.leg === i + 1);
      const xe = s.x(Math.min(ex ? ex.ms : t.close, view.to));
      el("line", { x1: x0, x2: Math.max(xe, x0 + 2), y1: s.y(l.tp), y2: s.y(l.tp), stroke: "var(--good)", "stroke-width": 1.5, "stroke-dasharray": "1.5 2.5", opacity: .9 }, svg);
      if (zoomed) el("text", { x: Math.max(xe, x0 + 2) + 3, y: s.y(l.tp) + 4, style: "fill:var(--good-text)" }, svg).textContent = `TP${i + 1}`;
    });
    let pts = [[t.open, t.sl], ...t.moves.filter(m => m.ms >= t.open)].map(p => Array.isArray(p) ? p : [p.ms, p.sl]);
    let sd = "";
    pts.forEach(([pt, sl], i) => {
      const xs = s.x(Math.max(pt, view.from)), xn = i + 1 < pts.length ? s.x(Math.min(pts[i + 1][0], view.to)) : x1;
      sd += (i === 0 ? "M" : "L") + xs + "," + s.y(sl) + "L" + Math.max(xn, xs + 2) + "," + s.y(sl);
    });
    el("path", { d: sd, fill: "none", stroke: "var(--critical)", "stroke-width": 1.5, "stroke-dasharray": "4 3", opacity: .85 }, svg);
    if (zoomed) el("text", { x: x1 + 3, y: s.y(pts[pts.length - 1][1]) + 4, style: "fill:var(--critical-text)" }, svg).textContent = "SL";
  });
  // signaux non pris
  REFUSED.filter(r => r.ms >= view.from && r.ms <= view.to).forEach(r => {
    const cx = s.x(r.ms), cy = s.y(r.price);
    const g = el("g", { style: "cursor:default" }, svg);
    el("path", { d: `M${cx - 5},${cy - 5}L${cx + 5},${cy + 5}M${cx + 5},${cy - 5}L${cx - 5},${cy + 5}`, stroke: "var(--refused)", "stroke-width": 2 }, g);
    el("circle", { cx, cy, r: 12, fill: "transparent" }, g);
    g.addEventListener("mousemove", ev => showTip(`<b>Signal non pris</b> · ${r.side || ""} · ${fmtT(r.ms)}<br>${esc(r.reason)}<div class="m">« ${esc(r.msg)} »</div>`, ev));
    g.addEventListener("mouseleave", hideTip);
  });
  // sorties
  tr.forEach(t => t.exits.filter(e => e.ms >= view.from && e.ms <= view.to).forEach(e => {
    el("circle", { cx: s.x(e.ms), cy: s.y(e.price), r: 4.5, fill: e.pnl >= 0 ? "var(--good)" : "var(--critical)", stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
  }));
  // entrées : triangle, taille selon le lot
  const maxLot = Math.max(...TRADES.map(t => t.lot), 0.01);
  tr.filter(t => t.open >= view.from && t.open <= view.to).forEach(t => {
    const cx = s.x(t.open), cy = s.y(t.entry), r = 6 + 8 * Math.sqrt(t.lot / maxLot);
    const up = t.side === "BUY";
    const g = el("g", { style: "cursor:pointer" }, svg);
    const dpath = up ? `M${cx},${cy - r} L${cx + r * .9},${cy + r * .6} L${cx - r * .9},${cy + r * .6}Z`
                     : `M${cx},${cy + r} L${cx + r * .9},${cy - r * .6} L${cx - r * .9},${cy - r * .6}Z`;
    el("path", { d: dpath, fill: up ? "var(--buy)" : "var(--sell)", stroke: "var(--surface-1)", "stroke-width": 2, "stroke-linejoin": "round" }, g);
    el("circle", { cx, cy, r: Math.max(14, r + 4), fill: "transparent" }, g);
    if (zoomed) {
      const ly = up ? cy + r + 14 : cy - r - 6;
      el("text", { x: cx, y: ly, "text-anchor": "middle", style: "fill:var(--text-secondary);font-weight:600" }, g).textContent = `#${t.id} ${nf(t.lot)} lot`;
    }
    g.addEventListener("mousemove", ev => showTip(tradeTip(t), ev));
    g.addEventListener("mouseleave", hideTip);
    g.addEventListener("click", () => focusTrade(t.id));
  });
}

// ---------- courbe du solde
function drawEquity() {
  const svg = document.getElementById("equity");
  const pts = [...EQUITY, [END, EQUITY[EQUITY.length - 1][1]]];
  const s = scales(svg, 170, [...pts.map(p => p[1]), S.balance0]);
  axes(svg, s, v => nf(v, 0));
  el("line", { x1: s.pad.l, x2: s.w - s.pad.r, y1: s.y(S.balance0), y2: s.y(S.balance0), stroke: "var(--text-muted)", "stroke-width": 1, "stroke-dasharray": "3 3" }, svg);
  let d = "";
  pts.forEach(([t, v], i) => { const x = s.x(Math.min(Math.max(t, view.from), view.to)); d += i === 0 ? `M${x},${s.y(v)}` : `H${x}V${s.y(v)}`; });
  el("path", { d, fill: "none", stroke: "var(--equity)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  const valueAt = t => { let v = pts[0][1]; for (const [pt, pv] of pts) { if (pt <= t) v = pv; else break; } return v; };
  crosshair(svg, s, valueAt, (t, v) => `Solde <b>${nf(v)} $</b> (${money(v - S.balance0)})<br>${fmtT(t)}`);
}

// ---------- tableaux
function drawTable() {
  const maxAbs = Math.max(...TRADES.map(t => Math.abs(t.pnl)), 1);
  const rows = TRADES.map(t => {
    const res = t.exits.length ? (t.tps_reached ? `TP${t.tps_reached}` : (t.pnl < -0.01 ? "SL" : "BE / clôture")) : "—";
    const w = Math.round(60 * Math.abs(t.pnl) / maxAbs);
    return `<tr data-id="${t.id}">
      <td>#${t.id}</td><td>${fmtT(t.signalMs)}</td>
      <td><span class="side" style="color:var(--text-primary)"><svg width="10" height="10" viewBox="0 0 12 12"><path d="${t.side === "BUY" ? "M6 1 L11 11 L1 11Z" : "M6 11 L11 1 L1 1Z"}" fill="var(--${t.side === "BUY" ? "buy" : "sell"})"/></svg>${t.side}</span></td>
      <td class="num"><b>${nf(t.lot)}</b></td><td>${t.legs.map(l => nf(l.vol)).join(" + ")}</td>
      <td class="num">${nf(t.entry)}</td><td class="num">${nf(t.sl)}</td><td>${t.legs.map(l => nf(l.tp, l.tp % 1 ? 2 : 0)).join(" · ")}</td>
      <td>${esc(t.verdict || "—")}</td><td>${res}</td>
      <td class="num"><span class="${t.pnl >= 0 ? "pos" : "neg"}">${money(t.pnl)}</span><span class="pbar" style="width:${w}px;background:var(--${t.pnl >= 0 ? "good" : "critical"})"></span></td></tr>`;
  }).join("");
  const tbl = document.getElementById("tbl");
  tbl.innerHTML = `<thead><tr><th>#</th><th>Heure</th><th>Sens</th><th class="num">Lot</th><th>Parts</th><th class="num">Entrée</th><th class="num">SL</th><th>TP</th><th>IA</th><th>Fin</th><th class="num">P&amp;L</th></tr></thead><tbody>${rows}</tbody>`;
  tbl.querySelectorAll("tbody tr").forEach(r => r.onclick = () => focusTrade(+r.dataset.id));

  const ref = document.getElementById("reftbl");
  if (!REFUSED.length) { document.getElementById("refcard").style.display = "none"; return; }
  ref.innerHTML = `<thead><tr><th>Heure</th><th>Sens</th><th>Raison</th></tr></thead><tbody>` +
    REFUSED.map(r => `<tr><td>${fmtT(r.ms)}</td><td>${esc(r.side || "—")}</td><td style="white-space:normal">${esc(r.reason)}</td></tr>`).join("") + "</tbody>";
}

function focusTrade(id) {
  const t = TRADES.find(x => x.id === id); if (!t) return;
  const span = Math.max(t.close - t.open, 30 * 60000);
  view = { from: Math.max(START, t.open - span * 0.6 - 20 * 60000), to: Math.min(END, t.close + span * 0.4 + 20 * 60000), focus: id };
  draw();
  document.getElementById("price").scrollIntoView({ behavior: "smooth", block: "center" });
}

function draw() {
  if (document.getElementById("price").parentElement.clientWidth < 120) return requestAnimationFrame(draw); // page pas encore mise en page
  renderDays(); drawPrice(); drawEquity();
}
drawTable(); draw();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 120); });
</script>
</body>
</html>
